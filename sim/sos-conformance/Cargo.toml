[package]
name = "sos-conformance"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "SOS conformance vector suite harness (SOS-03)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sos-conformance"
path = "src/main.rs"

[dependencies]
sos-sim = { path = "../sos-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
anyhow = "1"
