[package]
name = "sos-sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "SOS host simulator — reference implementation of rtos_kernel.scxml (SOS-02)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sos-sim"
path = "src/bin/sos-sim.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
