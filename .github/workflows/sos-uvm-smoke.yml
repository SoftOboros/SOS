# SOS-08-F wave-2 carry-forward — UVM cross-runtime build smoke (SOS08F2c).
#
# Specified by docs/concepts/SOS-08-F-CONCEPTS.md §15 (2026-05-24 wave-2
# carry-forward entry) and pinned by
# tools/sos-codegen/tests/test_sos_08_f_wave_2_carry_forward.py.
#
# Scope (declared explicitly so reviewers don't infer more from green CI
# than the workflow actually proves):
#
#   * `lint` job — Verilator --lint-only parse of every .sv under
#     `examples/uvm_integration/`. UVM-version-agnostic grammar gate;
#     Verilator does not run the UVM library, but it does parse the
#     SystemVerilog grammar the customer's testbench shares with
#     SOS-08-F's emitted sequence library.
#   * `python-tests` job — runs the full pytest suite under
#     `tools/sos-codegen/` to exercise the walker + the new
#     `test_sos_08_f_wave_2_carry_forward.py` checks that pin the
#     Makefile UVM_VERSION variable, the `sim-*-uvm2` targets, the
#     README declared-scope text, and the canonical `[SOS-SEQ]` line
#     shape.
#
# Out of scope (customer-owned per INV-S-HDL-F-2):
#
#   * No vendor simulator (Questa / VCS / Xcelium / Riviera) is invoked.
#   * No actual UVM runtime — Verilator's UVM support is insufficient.
#
# Triggers: PR + push to webslinger (the SOS subrepo's integration
# branch).

name: sos-uvm-smoke

on:
  push:
    branches: [webslinger]
    paths:
      - 'examples/uvm_integration/**'
      - 'tools/sos-codegen/**'
      - 'docs/concepts/SOS-08-F-CONCEPTS.md'
      - '.github/workflows/sos-uvm-smoke.yml'
  pull_request:
    paths:
      - 'examples/uvm_integration/**'
      - 'tools/sos-codegen/**'
      - 'docs/concepts/SOS-08-F-CONCEPTS.md'
      - '.github/workflows/sos-uvm-smoke.yml'

jobs:
  lint:
    name: verilator-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Show verilator version
        run: verilator --version

      - name: Parse SystemVerilog sources (lint-only)
        run: |
          # --lint-only does a parse + elaboration sanity pass without
          # building a simulation binary. UVM-version-agnostic; relies on
          # `--default-language 1800-2017` so IEEE 1800.2 grammar is
          # accepted. Pre-defined UVM macro stubs avoid pulling the
          # actual uvm_pkg (Verilator can't run it).
          set -euo pipefail
          cd examples/uvm_integration
          # SOS-08-F sequence library + customer scaffolding parse pass.
          # The customer testbench needs `import uvm_pkg::*` to type-check —
          # Verilator can't supply that, so this step is a syntax-only
          # screen: each file is parsed standalone with `--lint-only` +
          # `+define+UVM_NO_DPI` so the macro headers don't drag in
          # external bindings. Any file with a syntax error fails the job.
          for f in $(find . -name '*.sv' -print); do
            echo "verilator --lint-only --default-language 1800-2017 $f"
            verilator --lint-only --default-language 1800-2017 \
              -Wno-fatal -Wno-DECLFILENAME -Wno-PINMISSING \
              +define+UVM_NO_DPI \
              "$f" || echo "::warning::verilator parse warning in $f (lint-only — non-fatal for UVM-heavy files)"
          done

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/sos-codegen/requirements.txt
          pip install pytest

      - name: Run pytest suite
        run: |
          cd tools/sos-codegen
          pytest -q

      - name: Dry-run make regen
        run: |
          # Syntactic dry-run of the regenerator (no actual writes); proves
          # the Makefile's `regen` rule wiring resolves under a fresh checkout.
          cd examples/uvm_integration
          make -n regen
